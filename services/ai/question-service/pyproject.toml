[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "eduscope-question-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "eduscope-ai-common>=0.1,<0.2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "Jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["PyYAML>=6.0,<7", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[project.scripts]
eduscope-question-service = "question_service.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/question_service"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "question_service/prompts"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
